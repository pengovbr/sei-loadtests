name: Teste Versao

on:
  workflow_run:
    workflows: ["Pre Teste Versao"]
    types:
      - completed

jobs:

  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:

      - name: Get SEI-version parameter
        uses: actions/download-artifact@v4
        with:
          name: myparameter
          run-id: ${{ github.event.workflow_run.id }}
          path: ./sei-version.parameter

      - name: Read SEI-version parameter
        run: |
          SEI_VERSION=$(cat ./sei-version.parameter)

      - name: Checkout Me
        uses: actions/checkout@v7
        with:
            path: sei-loadtests

      - name: Fetch SEI
        uses: actions/checkout@v7
        with:
          repository: pengovbr/sei
          token: ${{ secrets.GH_PAT }}
          path: sei-loadtests/tests/assets/repos/sei-fontes
          ref: 4.0.12.15

      - name: Fetch sei-docker
        uses: actions/checkout@v7
        with:
          repository: pengovbr/sei-docker
          path: sei-loadtests/tests/assets/repos/sei-docker

      - name: RunTests
        run: |
          cd sei-loadtests/tests
          ls

